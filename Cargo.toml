[workspace]
members = ["crates/naive", "crates/naive-sys", "crates/naive-monoio", "crates/naive-compio", "xtask"]
default-members = ["crates/naive"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/Ember-Moth/naive-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util"] }
