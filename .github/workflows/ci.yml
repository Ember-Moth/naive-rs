name: Library
on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Ninja
        run: brew list ninja || brew install ninja
      - uses: actions/cache@v4
        with:
          path: target/native/toolchains
          key: naive-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - run: cargo fmt --all -- --check
      - run: cargo xtask check-patches
      - run: cargo xtask toolchain
      - run: cargo xtask build --jobs 4
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --no-run --locked
      - run: cargo test -p naive-rs --no-default-features --no-run --locked
      - run: cargo test -p naive-rs --no-default-features --features futures-io --no-run --locked
      - name: Verify runtime-independent dependency graph
        run: |
          cargo tree -p naive-rs --no-default-features -e normal > deps.txt
          ! grep -q tokio deps.txt
      - name: Verify clean upstream submodule
        run: test -z "$(git -C vendor/naiveproxy status --porcelain)"
