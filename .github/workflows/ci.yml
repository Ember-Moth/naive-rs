name: Library
on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Ninja
        run: brew list ninja || brew install ninja
      - uses: actions/cache@v4
        with:
          path: target/native/toolchains
          key: naive-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - run: cargo fmt --all -- --check
      - run: cargo xtask check-patches
      - run: cargo xtask toolchain
      - run: cargo xtask build --jobs 4
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --no-run --locked
      - run: cargo test -p naive-rs --no-default-features --no-run --locked
      - run: cargo test -p naive-rs --no-default-features --features futures-io --no-run --locked
      - name: Check minimum supported Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check -p naive-rs -p naive-sys -p naive-monoio --all-targets --all-features --locked
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check -p naive-compio --all-targets --all-features --locked
      - uses: actions/setup-go@v6
        with:
          go-version-file: tests/caddy/go.mod
          cache-dependency-path: |
            tests/caddy/go.sum
            tests/browser_fixture/go.sum
      - name: Build the loopback Caddy fixture
        run: python3 tests/build_caddy.py
      - name: Run owned IO and completion-runtime regressions
        run: python3 tests/owned_io.py --repeat 3
      - name: Run native TLS HTTP WebSocket and ECH regressions
        run: python3 tests/browser.py --build-fixture --repeat 3
      - name: Check network profile comparison
        run: python3 -m unittest discover -s tests -p test_network_profile.py
      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-io-runtime
          path: |
            target/owned-runtime/final/
            target/browser-runtime/
          if-no-files-found: ignore
      - name: Verify runtime-independent dependency graph
        run: |
          cargo tree -p naive-rs --no-default-features -e normal > deps.txt
          ! grep -q tokio deps.txt
          cargo tree -p naive-monoio -e normal > monoio-deps.txt
          ! grep -q 'tokio v' monoio-deps.txt
          cargo tree -p naive-compio -e normal > compio-deps.txt
          ! grep -q 'tokio v' compio-deps.txt
      - name: Verify clean upstream submodule
        run: test -z "$(git -C vendor/naiveproxy status --porcelain)"
