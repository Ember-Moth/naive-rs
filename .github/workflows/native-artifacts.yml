name: Native artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: aarch64-apple-darwin, runner: macos-26}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-linux-android, runner: ubuntu-24.04}
          - {target: x86_64-linux-android, runner: ubuntu-24.04}
          - {target: armv7-linux-androideabi, runner: ubuntu-24.04}
          - {target: aarch64-apple-ios, runner: macos-26}
          - {target: aarch64-apple-ios-sim, runner: macos-26}
          - {target: x86_64-apple-ios, runner: macos-26}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025}
          - {target: aarch64-pc-windows-msvc, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      IPHONEOS_DEPLOYMENT_TARGET: '18.0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      # LLVM headers exceed Windows path limits below the checkout and hash.
      NAIVE_NATIVE_SOURCE_ROOT: ${{ contains(matrix.target, 'windows') && 'C:\ns' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xz-utils binutils gpg pkg-config
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew list ninja || brew install ninja
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ninja unzip -y --no-progress
      - name: Set up Android SDK and NDK
        if: contains(matrix.target, 'android')
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;29.0.14206865'
      - name: Select Android NDK
        if: contains(matrix.target, 'android')
        run: |
          echo "NAIVE_ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          case "$TARGET" in
            aarch64-linux-android) key=AARCH64_LINUX_ANDROID; tool=aarch64-linux-android24-clang ;;
            x86_64-linux-android) key=X86_64_LINUX_ANDROID; tool=x86_64-linux-android24-clang ;;
            armv7-linux-androideabi) key=ARMV7_LINUX_ANDROIDEABI; tool=armv7a-linux-androideabi24-clang ;;
          esac
          echo "CARGO_TARGET_${key}_LINKER=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/$tool" >> "$GITHUB_ENV"
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag must match Cargo version'
          PY
      - uses: actions/cache@v4
        with:
          path: target/native/toolchains
          key: naive-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - run: cargo xtask check-patches
      - run: cargo xtask toolchain --target "$TARGET"
      - run: cargo xtask build --target "$TARGET" --jobs 2
      - name: Select matching Linux Clang and LLD
        if: contains(matrix.target, 'unknown-linux-gnu')
        run: |
          native_source="$(cargo xtask prepare --target "$TARGET")"
          case "$TARGET" in
            x86_64-unknown-linux-gnu) arch=amd64; key=X86_64_UNKNOWN_LINUX_GNU ;;
            aarch64-unknown-linux-gnu) arch=arm64; key=AARCH64_UNKNOWN_LINUX_GNU ;;
          esac
          # Chromium emits CREL relocations that the runner's GNU ld cannot read.
          # Restore normal glibc exports for the completion-runtime link fixtures.
          sysroot="$(python3 tools/prepare-linux-runtime-sysroot.py --target "$TARGET" --source "$native_source/src/out/sysroot-build/bullseye/bullseye_${arch}_staging")"
          echo "NAIVE_CLANG=$native_source/src/third_party/llvm-build/Release+Asserts/bin/clang" >> "$GITHUB_ENV"
          echo "NAIVE_LINUX_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "NAIVE_LINUX_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key}_LINKER=$GITHUB_WORKSPACE/tools/linux-clang-linker.sh" >> "$GITHUB_ENV"
      - name: Check Rust linking for every target
        run: cargo test -p naive-rs --target "$TARGET" --all-features --no-run --locked
      - name: Check completion adapter linking on desktop targets
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin' || contains(matrix.target, 'unknown-linux-gnu')
        run: cargo test -p naive-monoio -p naive-compio --target "$TARGET" --all-features --no-run --locked
      - name: Package native SDK
        run: cargo xtask package --target "$TARGET"
      - name: Verify package install and consumer link
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc'
        run: python3 tests/artifact_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Publish immutable versioned native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
