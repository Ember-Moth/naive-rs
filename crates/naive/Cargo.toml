[package]
name = "naive-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Asynchronous Rust streams backed by the native NaiveProxy network stack"

[lib]
name = "naive"

[dependencies]
naive-sys = { path = "../naive-sys", version = "0.1.0" }
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, optional = true }
futures-channel = "0.3"
futures-io = { version = "0.3", optional = true }
event-listener = "5"
bytes = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "sync", "time"] }
libc = "0.2"
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["io"] }

[features]
default = []
bytes = ["dep:bytes"]
tokio = ["dep:tokio"]
futures-io = ["dep:futures-io"]
# Enables benchmark access to performance controls added by the optimized bridge.
perf-tuning = []

[[bench]]
name = "transport"
harness = false
required-features = ["tokio"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
